name: Generate Hadron Brand PNG Assets

# The SVGs are canonical. This workflow commits deterministic binary exports
# into same-repository feature branches so production does not depend on runtime
# image conversion or stale legacy PNGs. It never runs on fork branches.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "assets/*.svg"
      - "frontend/public/*.svg"
      - "scripts/generate_brand_assets.py"
      - ".github/workflows/brand-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hadron-brand-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reproducible SVG renderer
        run: python -m pip install 'cairosvg==2.8.2' 'Pillow==12.3.0'
      - name: Regenerate the full brand export set
        run: python scripts/generate_brand_assets.py
      - name: Check all PNG assets exactly match canonical SVGs
        run: python scripts/generate_brand_assets.py --check
      - name: Commit generated binary exports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/logo.png assets/icon.png assets/og-image.png
          git add frontend/public/logo.png frontend/public/og-image.png
          git add frontend/public/icon-192.png frontend/public/icon-512.png
          git add frontend/public/apple-touch-icon.png frontend/public/favicon-16x16.png frontend/public/favicon-32x32.png
          if git diff --cached --quiet; then
            echo "Brand PNGs are already up to date."
          else
            git commit -m "chore(brand): synchronize generated PNG artwork"
            git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
          fi
