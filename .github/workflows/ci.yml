# .github/workflows/ci.yml
#
# Production CI pipeline for Hadron Autonomous AI PR Review Agent.
#
# Pipeline Architecture:
#   1. lint-and-typecheck  — Ruff linting, Python syntax validation, and Frontend TypeScript typecheck
#   2. test-suite          — Complete deterministic critical-path test suite (315+ unit, contract,
#                            security, disaster recovery, and isolation tests with mocked I/O)
#   3. frontend-build      — Next.js production build, route verification (16/16 routes), and static export
#   4. eval-gate           — Paid evaluation gate with real LLM model calls (ONLY on push to main)
#
# Security & Reliability Guarantees:
#   - Concurrency group with cancel-in-progress to terminate redundant runs
#   - Least-privilege GITHUB_TOKEN permissions (contents: read, pull-requests: read)
#   - PRs run with network denied / isolated mock credentials to protect secrets
#   - Deploys to Railway / production require all checks to pass

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1: Lint & Static Typecheck (Python + TypeScript)
  # ---------------------------------------------------------------------------
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install Python lint dependencies
        run: uv pip install --system ruff

      - name: Python lint (ruff)
        run: ruff check backend/ tests/

      - name: Python syntax check
        run: |
          find backend tests scripts -name "*.py" | xargs python3 -m py_compile
          echo "All Python files compiled cleanly."

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend dependencies
        run: npm ci --prefix frontend

      - name: Frontend TypeScript typecheck
        run: npm run lint --prefix frontend

  # ---------------------------------------------------------------------------
  # JOB 2: Full Deterministic Test Suite (Unit, Contract, Security, Integration)
  # ---------------------------------------------------------------------------
  test-suite:
    name: Critical-Path Test Suite
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    env:
      APP_ENV: test
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      REDIS_URL: "redis://localhost:6379"
      QDRANT_URL: "http://localhost:6333"
      QDRANT_API_KEY: "test-key"
      QDRANT_COLLECTION_NAME: "test_collection"
      OPENAI_API_KEY: "sk-test-placeholder"
      ANTHROPIC_API_KEY: "sk-ant-placeholder"
      SECURITY_PROVIDER: "openai"
      SECURITY_MODEL: "gpt-4o"
      GITHUB_WEBHOOK_SECRET: "test-secret"
      GITHUB_TOKEN: "ghp_test_placeholder"
      API_KEY: "valid-test-key-12345"
      LOG_LEVEL: "ERROR"
      CONFIDENCE_THRESHOLD: "0.85"
      WORKFLOW_TIMEOUT_SECONDS: "300"
      MAX_CONCURRENT_REVIEWS: "5"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install all project dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run complete test suite (Unit, Contract, Security, DR)
        run: |
          # Runs all non-eval tests with full verbosity and trace summaries
          python3 -m pytest tests/ -v --tb=short -m "not eval"

  # ---------------------------------------------------------------------------
  # JOB 3: Frontend Build & Route Verification
  # ---------------------------------------------------------------------------
  frontend-build:
    name: Frontend Build & Verify
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Build Next.js application
        run: npm run build --prefix frontend

  # ---------------------------------------------------------------------------
  # JOB 4: Eval Gate (Real LLM Prompt & Verdict Regression Gate)
  # Only executes on push to main with configured secrets
  # ---------------------------------------------------------------------------
  eval-gate:
    name: Eval Gate (Real LLM)
    runs-on: ubuntu-latest
    needs: [test-suite, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      APP_ENV: test
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      REDIS_URL: "redis://localhost:6379"
      QDRANT_URL: "http://localhost:6333"
      QDRANT_API_KEY: "test-key"
      QDRANT_COLLECTION_NAME: "test_collection"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: "test-placeholder"
      SECURITY_PROVIDER: "openai"
      SECURITY_MODEL: "gpt-4o"
      GITHUB_WEBHOOK_SECRET: "test-secret"
      GITHUB_TOKEN: "ghp_test_placeholder"
      LOG_LEVEL: "INFO"
      API_KEY: "valid-test-key-12345"
      CONFIDENCE_THRESHOLD: "0.85"
      WORKFLOW_TIMEOUT_SECONDS: "300"
      MAX_CONCURRENT_REVIEWS: "5"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run eval gate test
        run: python3 -m pytest tests/test_eval_gate.py -v -s --timeout=120
