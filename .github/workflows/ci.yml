# .github/workflows/ci.yml
#
# Production CI pipeline for Hadron Autonomous AI PR Review Agent.
#
# Pipeline Architecture:
#   1. lint-and-typecheck  — Ruff, repository checks, and frontend TypeScript typecheck
#   2. test-suite          — Deterministic tests with mocked external services
#   3. frontend-build      — Next.js and GitHub Pages builds plus browser regression checks
#   4. backend-image       — Build the production backend container
#
# Security & Reliability Guarantees:
#   - Concurrency group with cancel-in-progress to terminate redundant runs
#   - Least-privilege GITHUB_TOKEN permissions (contents: read)
#   - Deterministic tests use placeholder credentials and skip paid provider evaluations

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1: Lint & Static Typecheck (Python + TypeScript)
  # ---------------------------------------------------------------------------
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install Python lint dependencies
        run: uv pip install --system ruff

      - name: Python lint (ruff)
        run: ruff check backend/ tests/

      - name: Repository structure and frontend import boundaries
        run: python3 scripts/check_structure.py

      - name: Python syntax check
        run: |
          find backend tests scripts -name "*.py" | xargs python3 -m py_compile
          echo "All Python files compiled cleanly."

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend dependencies
        run: npm ci --prefix frontend

      - name: Frontend TypeScript typecheck
        run: npm run lint --prefix frontend

  # ---------------------------------------------------------------------------
  # JOB 2: Full Deterministic Test Suite (Unit, Contract, Security, Integration)
  # ---------------------------------------------------------------------------
  test-suite:
    name: Critical-Path Test Suite
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: lint-and-typecheck
    env:
      APP_ENV: test
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      REDIS_URL: "redis://localhost:6379"
      QDRANT_URL: "http://localhost:6333"
      QDRANT_API_KEY: "test-key"
      QDRANT_COLLECTION_NAME: "test_collection"
      OPENAI_API_KEY: "sk-test-placeholder"
      ANTHROPIC_API_KEY: "sk-ant-placeholder"
      SECURITY_PROVIDER: "openai"
      SECURITY_MODEL: "gpt-4o"
      GITHUB_WEBHOOK_SECRET: "test-secret"
      GITHUB_TOKEN: "ghp_test_placeholder"
      API_KEY: "valid-test-key-12345"
      LOG_LEVEL: "ERROR"
      CONFIDENCE_THRESHOLD: "0.85"
      WORKFLOW_TIMEOUT_SECONDS: "300"
      MAX_CONCURRENT_REVIEWS: "5"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install all project dependencies
        run: uv sync --locked --extra dev

      - name: Run complete test suite (Unit, Contract, Security, DR)
        run: |
          # Runs all non-eval tests with full verbosity and trace summaries
          uv run --locked python -m pytest tests/ -v --tb=short -m "not eval"

  # ---------------------------------------------------------------------------
  # JOB 3: Frontend Build & Route Verification
  # ---------------------------------------------------------------------------
  frontend-build:
    name: Frontend Build & Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Build Next.js application
        run: npm run build --prefix frontend

      - name: Build static frontend for GitHub Pages
        run: npm run build:pages --prefix frontend

      - name: Install browser for UI regression checks
        run: npx --prefix frontend playwright-core install --with-deps chromium

      - name: Verify unified frontend in browser
        run: |
          npm run start --prefix frontend > /tmp/hadron-ui-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 1
          done
          if ! kill -0 "$SERVER_PID" 2>/dev/null || ! curl --silent --fail http://127.0.0.1:3000/ > /dev/null; then
            cat /tmp/hadron-ui-server.log
            echo "Frontend server did not become ready."
            exit 1
          fi
          npm run test:ui --prefix frontend

  # ---------------------------------------------------------------------------
  # JOB 4: Backend Production Container Build
  # ---------------------------------------------------------------------------
  backend-image:
    name: Backend Container Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend production image
        run: docker build --tag hadron-backend:ci .
