# docker-compose.dev.yml — AI PR Review Agent (ALL-LOCAL mode)
#
# Runs all components locally with Docker volumes for clean-slate testing and offline dev.
# Process commands decouple API and Worker into distinct containers.

services:

  postgres:
    image: postgres:16.3-alpine
    container_name: hadron_dev_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pr_review_agent
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - hadron_dev_net

  redis:
    image: redis:7.2.4-alpine
    container_name: hadron_dev_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - hadron_dev_net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hadron_dev_api
    restart: unless-stopped
    command: ["api"]
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/pr_review_agent"
      REDIS_URL: "redis://redis:6379"
      APP_ENV: "development"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hadron_dev_net

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hadron_dev_worker
    restart: unless-stopped
    command: ["worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/pr_review_agent"
      REDIS_URL: "redis://redis:6379"
      APP_ENV: "development"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - hadron_dev_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hadron_dev_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: "http://api:8000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - hadron_dev_net

networks:
  hadron_dev_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
