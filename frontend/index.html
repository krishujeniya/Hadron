<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hadron | Autonomous PR Review Engine</title>
    <meta name="description" content="Automate code reviews on GitHub pull requests. Four parallel specialist agents inspect diffs across security, code quality, test coverage, and documentation before merge." />
    
    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />

    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Hadron | Autonomous PR Review Engine" />
    <meta property="og:description" content="Automate code reviews on GitHub pull requests. Four parallel specialist agents inspect diffs across security, code quality, test coverage, and documentation before merge." />
    <meta property="og:image" content="./og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hadron | Autonomous PR Review Engine" />
    <meta name="twitter:description" content="Automate code reviews on GitHub pull requests. Four parallel specialist agents inspect diffs across security, code quality, test coverage, and documentation before merge." />
    <meta name="twitter:image" content="./og-image.png" />

    <!-- Theme Initialization Script -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('hadron_theme');
          var isDark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches) || (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.classList.remove('light');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.add('light');
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <!-- SPA URL Restoration Script for GitHub Pages -->
    <script>
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          var parts = decoded.split('?');
          var pathPart = parts[0];
          try { pathPart = decodeURIComponent(pathPart); } catch(e) {}
          if (pathPart.charAt(0) !== '/') pathPart = '/' + pathPart;
          var queryPart = parts.slice(1).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + pathPart + (queryPart ? '?' + queryPart : '') + l.hash
          );
        } else if (l.search.indexOf('p=') !== -1) {
          var params = new URLSearchParams(l.search);
          var p = params.get('p') || '';
          params.delete('p');
          var q = params.toString().replace(/~and~/g, '&');
          try { p = decodeURIComponent(p); } catch(e) {}
          if (p.charAt(0) !== '/') p = '/' + p;
          window.history.replaceState(null, null,
            l.pathname.replace(/\/$/, '') + p + (q ? '?' + q : '') + l.hash
          );
        }
      }(window.location));
    </script>
  </head>
  <body class="bg-canvas text-fg antialiased selection:bg-brand/20 selection:text-brand">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
