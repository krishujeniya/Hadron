<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 96" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="logoHadronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <linearGradient id="logoTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- === ICON MARK (x: 8 to 88, y: 8 to 88, size: 80x80) === -->
  <g transform="translate(8, 8)">
    <!-- Base Plate -->
    <rect x="0" y="0" width="80" height="80" rx="20" fill="#12151D" stroke="#1F2430" stroke-width="1.5" />

    <!-- Calibration Ring -->
    <circle cx="40" cy="40" r="32" fill="none" stroke="url(#logoHadronGrad)" stroke-width="1.2" stroke-dasharray="2 4" opacity="0.45" />

    <!-- "H" Accelerator Pillars -->
    <path d="M 29 20 Q 32 40 29 60" fill="none" stroke="url(#logoHadronGrad)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 51 20 Q 48 40 51 60" fill="none" stroke="url(#logoHadronGrad)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 30 40 L 50 40" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.9" />

    <!-- Dual Crossing Particle Beams -->
    <ellipse cx="40" cy="40" rx="27" ry="10" fill="none" stroke="url(#logoHadronGrad)" stroke-width="1.6" transform="rotate(-34 40 40)" opacity="0.75" />
    <ellipse cx="40" cy="40" rx="27" ry="10" fill="none" stroke="#38BDF8" stroke-width="1.6" transform="rotate(34 40 40)" opacity="0.75" />

    <!-- 4 Quantum Agent Nodes -->
    <circle cx="21" cy="27" r="3.2" fill="#38BDF8" filter="url(#logoGlow)" />
    <circle cx="59" cy="27" r="3.2" fill="#6366F1" filter="url(#logoGlow)" />
    <circle cx="59" cy="53" r="3.2" fill="#10B981" filter="url(#logoGlow)" />
    <circle cx="21" cy="53" r="3.2" fill="#A855F7" filter="url(#logoGlow)" />

    <!-- Center Collision Flash -->
    <circle cx="40" cy="40" r="5" fill="#38BDF8" filter="url(#logoGlow)" opacity="0.8" />
    <circle cx="40" cy="40" r="2.8" fill="#FFFFFF" />
  </g>

  <!-- === TYPOGRAPHY WORDMARK === -->
  <g transform="translate(108, 0)">
    <!-- Primary Title: HADRON -->
    <text x="0" y="48" fill="url(#logoTextGrad)" font-family="system-ui, -apple-system, 'SF Pro Display', Inter, sans-serif" font-weight="900" font-size="34" letter-spacing="0.14em">HADRON</text>

    <!-- Subtitle: Autonomous Multi-Agent PR Review -->
    <text x="2" y="68" fill="#8A93A6" font-family="'SF Mono', Menlo, Consolas, monospace" font-weight="600" font-size="10" letter-spacing="0.22em">AUTONOMOUS PR REVIEW ENGINE</text>

    <!-- Tag Badge -->
    <rect x="238" y="27" width="80" height="20" rx="6" fill="#6366F1" fill-opacity="0.12" stroke="#6366F1" stroke-opacity="0.35" stroke-width="1" />
    <text x="278" y="41" fill="#818CF8" font-family="'SF Mono', Menlo, Consolas, monospace" font-weight="700" font-size="9.5" text-anchor="middle" letter-spacing="0.08em">QUAD-AGENT</text>
  </g>
</svg>
