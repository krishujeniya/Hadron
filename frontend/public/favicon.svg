<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Icon Plate -->
    <linearGradient id="hadronPlateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161A23" />
      <stop offset="100%" stop-color="#0B0D12" />
    </linearGradient>

    <!-- Beam & Orbit Gradients -->
    <linearGradient id="hadronBeam1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <linearGradient id="hadronBeam2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="hadronCoreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.8" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="hadronGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base / Container Plate -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#hadronPlateGrad)" stroke="#1F2430" stroke-width="2" />

  <!-- Outer Collider Detector Ring -->
  <circle cx="64" cy="64" r="50" fill="none" stroke="url(#hadronBeam1)" stroke-width="1.5" stroke-dasharray="3 5" opacity="0.4" />

  <!-- The "H" Magnetic Accelerator Pillars -->
  <!-- Left Pillar (Curving inward slightly towards collision waist) -->
  <path d="M 46 30 Q 50 64 46 98" fill="none" stroke="url(#hadronBeam1)" stroke-width="6" stroke-linecap="round" />
  
  <!-- Right Pillar -->
  <path d="M 82 30 Q 78 64 82 98" fill="none" stroke="url(#hadronBeam2)" stroke-width="6" stroke-linecap="round" />

  <!-- Horizontal Collision Bridge -->
  <path d="M 48 64 L 80 64" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.9" />

  <!-- Relativistic Crossing Beams (Rotated Ellipses) -->
  <ellipse cx="64" cy="64" rx="42" ry="15" fill="none" stroke="url(#hadronBeam1)" stroke-width="2" transform="rotate(-34 64 64)" opacity="0.75" />
  <ellipse cx="64" cy="64" rx="42" ry="15" fill="none" stroke="url(#hadronBeam2)" stroke-width="2" transform="rotate(34 64 64)" opacity="0.75" />

  <!-- 4 Sub-Agent Quantum Nodes -->
  <!-- 01: Security (Cyan) - Top Left -->
  <circle cx="34" cy="42" r="4.5" fill="#38BDF8" filter="url(#hadronGlow)" />
  <circle cx="34" cy="42" r="1.5" fill="#FFFFFF" />

  <!-- 02: Quality (Indigo) - Top Right -->
  <circle cx="94" cy="42" r="4.5" fill="#6366F1" filter="url(#hadronGlow)" />
  <circle cx="94" cy="42" r="1.5" fill="#FFFFFF" />

  <!-- 03: Test Coverage (Emerald) - Bottom Right -->
  <circle cx="94" cy="86" r="4.5" fill="#10B981" filter="url(#hadronGlow)" />
  <circle cx="94" cy="86" r="1.5" fill="#FFFFFF" />

  <!-- 04: Documentation (Violet) - Bottom Left -->
  <circle cx="34" cy="86" r="4.5" fill="#A855F7" filter="url(#hadronGlow)" />
  <circle cx="34" cy="86" r="1.5" fill="#FFFFFF" />

  <!-- Central Collision Flash Nucleus -->
  <circle cx="64" cy="64" r="8" fill="url(#hadronCoreGlow)" filter="url(#hadronGlow)" opacity="0.8" />
  <circle cx="64" cy="64" r="4.5" fill="#FFFFFF" />
</svg>
