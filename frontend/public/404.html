<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hadron | Redirecting...</title>
    <script>
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      (function() {
        var pathSegmentsToKeep = 1; // 1 segment for GitHub Project Pages: /<repo-name>/
        var l = window.location;
        if (l.hostname.indexOf('github.io') === -1) {
          pathSegmentsToKeep = 0;
        }
        var path = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
        var query = l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '';
        var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          encodeURIComponent(path) + query + l.hash;
        l.replace(redirectUrl);
      })();
    </script>
  </head>
  <body>
    <p style="font-family: monospace; font-size: 13px; color: #888; padding: 20px;">
      Redirecting to Hadron application...
    </p>
  </body>
</html>
