# render.yaml - Render deployment configuration
# https://render.com/docs/blueprint-spec
# Configured for 100% Free Plan (Web Service running both FastAPI + ARQ worker)

services:
  - type: web
    name: hadron-backend
    env: python
    plan: free
    buildCommand: pip install -e .
    startCommand: bash ./scripts/start.sh
    healthCheckPath: /health/live
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_PRIVATE_KEY
        sync: false
      - key: GITHUB_API_BASE_URL
        value: https://api.github.com
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: SECURITY_PROVIDER
        value: openai
      - key: SECURITY_MODEL
        value: gpt-4o
      - key: MAX_CONCURRENT_REVIEWS
        value: 3
      - key: CONFIDENCE_THRESHOLD
        value: 0.7
      - key: WORKFLOW_TIMEOUT_SECONDS
        value: 300
      - key: API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
